<!doctype html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Tablas HTML5 - DWEC</title>
    </head>
    <body>
        <main>
            <table>
                <caption>
                    Módulos del ciclo de Desarrollo de Aplicaciones Web
                </caption>
                <thead>
                    <tr>
                        <th scope="col">Módulo</th>
                        <th scope="col">Área</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>Sillas</td>
                        <td>comedor</td>
                    </tr>
                    <tr>
                        <td>Mesa</td>
                        <td>Comedor</td>
                    </tr>
                    <tr>
                        <td>Nevera</td>
                        <td>Cocina</td>
                    </tr>
                    <tr>
                        <td>horno</td>
                        <td>Cocina</td>
                    </tr>
                    <tr>
                        <td>vide</td>
                        <td>baño</td>
                    </tr>
                </tbody>
                <tfoot>
                    <tr>
                        <td>cosa</td>
                        <td>coso</td>
                    </tr>
                </tfoot>
            </table>
            <table>
                <caption>
                    Inventario de muebles por estancia
                </caption>
                <thead>
                    <tr>
                        <th scope="colgroup" colspan="2">Datos del mueble</th>
                        <th scope="col" rowspan="2">Estancia</th>
                    </tr>
                    <tr>
                        <th scope="col">Elemento</th>
                        <th scope="col">Cantidad</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>Sillas</td>
                        <td>4</td>
                        <td rowspan="2">Comedor</td>
                    </tr>
                    <tr>
                        <td>Mesa</td>
                        <td>1</td>
                    </tr>
                    <tr>
                        <td>Nevera</td>
                        <td>1</td>
                        <td rowspan="2">Cocina</td>
                    </tr>
                    <tr>
                        <td>Horno</td>
                        <td>1</td>
                    </tr>
                </tbody>
            </table>
        </main>
    </body>
</html>
